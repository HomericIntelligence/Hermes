name: Required Checks

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# Single source of truth — bump together with GITLEAKS_VERSION in
# .github/workflows/security.yml so PR scans and required CI agree.
env:
  GITLEAKS_VERSION: "8.30.1"

concurrency:
  group: required-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hermes-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-hermes-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t hermes-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-lint`.
      - name: lint (in container)
        run: bash scripts/run_ci_local.sh lint

  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: "Reject silent-failure workaround in shell/YAML/Dockerfile/justfile/HCL"
        run: |
          # Ports the regression guard from HomericIntelligence/Odysseus#280.
          # Matches the forbidden idiom at end of line or before a trailing comment.
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            -- \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.hcl' \
            'Dockerfile*' '**/Dockerfile*' \
            'justfile' '**/justfile' 'Justfile' '**/Justfile')
          # Skip this workflow file itself (heredoc would otherwise self-match).
          declare -a scan_files=()
          for f in "${files[@]}"; do
            case "$f" in
              .github/workflows/_required.yml) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nE '\|\|[[:space:]]*true([[:space:]]*$|[[:space:]]+#)' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found silent-failure workarounds above. Refactor to an explicit if-guard or real conditional.'
            exit 1
          fi
          echo 'OK: no silent-failure workarounds found'

      - name: "Reject continue-on-error workflow opt-out"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No workflow files"
            exit 0
          fi
          if grep -nE '^[[:space:]]*continue-on-error:[[:space:]]*true[[:space:]]*$' "${files[@]}"; then
            echo ""
            echo '::error::Found "continue-on-error: true" above. Fix the root cause instead of suppressing the failure.'
            exit 1
          fi
          echo 'OK: no "continue-on-error: true" found'

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hermes-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-hermes-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t hermes-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-markdownlint`.
      - name: markdownlint (in container)
        run: bash scripts/run_ci_local.sh markdownlint

  pixi-check-matrix:
    name: pixi-check-matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: lint
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14  # arm64 — validates osx-arm64 entries in pixi.lock (issue #501)
          # macos-13 runners were retired by GitHub (jobs queue forever and
          # strand the workflow run); macos-15-intel is the remaining x86_64
          # hosted label and keeps the osx-64 lock validation (issue #501).
          - macos-15-intel  # x86_64 — validates osx-64 entries in pixi.lock (issue #501)
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Skip if no pixi.toml
        id: detect
        run: |
          if [ ! -f pixi.toml ]; then
            echo "::notice::No pixi.toml in repo, skipping pixi-check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup pixi
        if: steps.detect.outputs.skip == 'false'
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.1
        with:
          pixi-version: v0.68.0
          cache: true
      - name: pixi install (locked)
        if: steps.detect.outputs.skip == 'false'
        run: |
          if [ -f pixi.lock ]; then
            pixi install --locked
          else
            echo "::warning::pixi.toml present but pixi.lock missing — running unlocked"
            pixi install
          fi

  # Preserves the historical required-check name `pixi-check` so existing
  # branch-protection rules continue to gate merges. Succeeds iff every leg
  # of pixi-check-matrix succeeded. Repo admins can later add the per-OS
  # leg names (pixi-check-matrix (macos-14), pixi-check-matrix (macos-15-intel))
  # as additional required checks at their pace; this aggregator works in
  # the meantime so no protection window opens at merge time.

  pixi-check:
    name: pixi-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hermes-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-hermes-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t hermes-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-pixi-check`.
      - name: pixi-check (in container)
        run: bash scripts/run_ci_local.sh pixi-check

  justfile-check:
    name: justfile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hermes-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-hermes-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t hermes-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-justfile-check`.
      - name: justfile-check (in container)
        run: bash scripts/run_ci_local.sh justfile-check

  symlink-check:
    name: symlink-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hermes-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-hermes-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t hermes-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-symlink-check`.
      - name: symlink-check (in container)
        run: bash scripts/run_ci_local.sh symlink-check

  no-latest-tags:
    # Regression guard for #316: a bare `nats:latest` slipped into
    # docker-compose.yml because nothing rejected unpinned tags. See #566.
    name: no-latest-tags
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Assert no :latest image tags
        run: bash scripts/check-no-latest-tags.sh

  workflow-timeouts:
    # Regression guard for #420: every job in .github/workflows/*.yml MUST
    # declare `timeout-minutes`. JSON-Schema validation (schema-validation
    # job) cannot enforce this semantic rule. Reusable-workflow callers are
    # skipped automatically — GitHub rejects `timeout-minutes` on those.
    name: workflow-timeouts
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: Install pyyaml
        run: pip install --quiet pyyaml
      - name: Assert every workflow job has timeout-minutes
        run: bash scripts/check-workflow-timeouts.sh

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hermes-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-hermes-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t hermes-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-unit-tests`.
      - name: unit-tests (in container)
        run: bash scripts/run_ci_local.sh unit-tests

      - name: Per-module coverage minimums
        run: |
          podman run --rm --userns=keep-id:uid=1000,gid=1000 \
            -v "$PWD:/workspace:Z" -w /workspace hermes-ci:local \
            bash -lc '
            pixi install --locked --quiet
            pixi run coverage report --include="src/hermes/__init__.py" --fail-under=70
            pixi run coverage report --include="src/hermes/__main__.py" --fail-under=95
            pixi run coverage report --include="src/hermes/config.py" --fail-under=90
            pixi run coverage report --include="src/hermes/logging_config.py" --fail-under=90
            pixi run coverage report --include="src/hermes/metrics.py" --fail-under=95
            pixi run coverage report --include="src/hermes/middleware.py" --fail-under=80
            pixi run coverage report --include="src/hermes/models.py" --fail-under=90
            pixi run coverage report --include="src/hermes/publisher.py" --fail-under=90
            pixi run coverage report --include="src/hermes/rate_limit.py" --fail-under=95
            pixi run coverage report --include="src/hermes/server.py" --fail-under=90
            '

  macos-tests:
    name: macos-tests
    runs-on: macos-latest  # arm64 only; osx-64 (macos-13) is declared in pixi.lock but not exercised in CI
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.1
        with:
          pixi-version: v0.68.0
          cache: true

      - name: Install locked environment (exercises osx-arm64 solve)
        run: pixi install --locked

      - name: Unit tests (no NATS/Docker required on macOS runners)
        run: pixi run pytest -m "not integration"

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hermes-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-hermes-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t hermes-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-integration-tests`.
      - name: integration-tests (in container)
        run: bash scripts/run_ci_local.sh integration-tests

  test:
    # Canonical aggregate test check. Succeeds iff both the unit and integration
    # test legs pass. The per-leg checks (unit-tests, integration-tests) are
    # KEPT so existing branch-protection rules and dashboards keep working.
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read
    steps:
      - name: Aggregate test result
        run: echo "All test legs (unit-tests, integration-tests) succeeded."

  readonly-fs-smoke:
    name: readonly-fs-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Run read-only filesystem smoke test
        env:
          WEBHOOK_SECRET: smoke-test-secret-for-readonly-fs-min32
        run: bash scripts/smoke-readonly-fs.sh

  docker-build-smoke:
    name: docker-build-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Build image
        run: docker build --no-cache -t hermes:test .

      - name: Run import sanity check
        # The image COPYs src/hermes/ without pip-installing the package, so no
        # dist-info exists and hermes.__version__ resolves to "unknown" — this
        # step smoke-tests that the package and its submodules *import* cleanly,
        # not that a versioned wheel is installed.
        run: docker run --rm hermes:test python -c "import hermes; import hermes.server; assert hermes.server is not None; print('import OK:', hermes.__version__)"

  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hermes-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-hermes-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t hermes-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-security-dependency-scan`.
      - name: security-dependency-scan (in container)
        run: bash scripts/run_ci_local.sh security-dependency-scan

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hermes-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-hermes-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t hermes-ci:local .
      - name: Run Gitleaks
        run: |
          if [ -f .gitleaks.toml ]; then
            podman run --rm --userns=keep-id:uid=1000,gid=1000 \
              -v "$PWD:/workspace:Z" -w /workspace hermes-ci:local \
              gitleaks detect --source /workspace --config .gitleaks.toml \
                --report-format sarif --report-path gitleaks.sarif --redact --exit-code 1
          else
            podman run --rm --userns=keep-id:uid=1000,gid=1000 \
              -v "$PWD:/workspace:Z" -w /workspace hermes-ci:local \
              gitleaks detect --source /workspace \
                --report-format sarif --report-path gitleaks.sarif --redact --exit-code 1
          fi

      - name: Upload Gitleaks SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@4e828ff8d448a8a6e532957b1811f387a63867e8  # v3.26.13
        with:
          sarif_file: gitleaks.sarif
          name: gitleaks-report

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.1
        with:
          pixi-version: v0.68.0
          cache: true

      - name: Install build tools
        run: pixi run pip install build hatchling

      - name: Build wheel
        run: pixi run python -m build --no-isolation

      - name: Upload dist artifact
        # Shared with the package + install jobs so they validate the exact
        # artifact this job produced instead of rebuilding it.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"

      - name: Download dist artifact
        # Reuses the wheel/sdist built by the `build` job — no rebuild.
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: dist
          path: dist/

      - name: Install twine
        run: pip install --quiet twine

      - name: twine check
        run: twine check dist/*

  install:
    name: install
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: build
    permissions:
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"

      - name: Download dist artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53  # v6.0.0
        with:
          name: dist
          path: dist/

      - name: Install the wheel into a clean virtualenv
        run: |
          set -euo pipefail
          python -m venv /tmp/hermes-venv
          # shellcheck disable=SC1091
          . /tmp/hermes-venv/bin/activate
          wheel=$(ls dist/*.whl)
          pip install --quiet "$wheel"

      - name: Smoke-test the installed package
        # Hermes ships no console entry point, so install-smoke imports the
        # package and exercises the `python -m hermes` module entry point.
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . /tmp/hermes-venv/bin/activate
          python -c "import hermes; import hermes.server; print('import OK:', hermes.__version__)"
          python -m hermes --help >/dev/null
          echo "OK: installed wheel imports and 'python -m hermes' runs"

  release:
    # Release DRY-RUN on every push/PR. Validates the artifacts and contract a
    # real release depends on, but never publishes — publishing stays gated on
    # version tags in publish.yml. Emits the canonical `release` check-run.
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [package, install]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.1
        with:
          pixi-version: v0.68.0
          cache: true

      - name: Validate version parity (pyproject.toml vs pixi.toml)
        run: |
          set -euo pipefail
          PYPROJECT_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          PIXI_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pixi.toml','rb'))['workspace']['version'])")
          if [ "$PYPROJECT_VERSION" != "$PIXI_VERSION" ]; then
            echo "::error::release blocked — version mismatch: pyproject.toml ($PYPROJECT_VERSION) != pixi.toml ($PIXI_VERSION)"
            exit 1
          fi
          echo "OK: release version is $PYPROJECT_VERSION"

      - name: Validate published contract (openapi.json is current)
        # The OpenAPI contract is part of the release surface; assert the
        # committed spec matches the live FastAPI schema before a release.
        run: |
          set -euo pipefail
          pixi run python scripts/export-openapi.py --output /tmp/openapi-release.json
          if ! diff -u openapi.json /tmp/openapi-release.json; then
            echo "::error::release blocked — openapi.json is stale. Run 'just export-openapi' and commit."
            exit 1
          fi
          echo "OK: openapi.json contract matches the live schema"

      - name: Release dry-run summary
        run: echo "Release dry-run passed (no publish — publishing is tag-gated in publish.yml)."

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hermes-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-hermes-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t hermes-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-schema-validation`.
      - name: schema-validation (in container)
        run: bash scripts/run_ci_local.sh schema-validation

  openapi-lint:
    # Spectral lint for openapi.json (issue #434). Mirrors the
    # `spectral-openapi` pre-commit hook so the rule is enforced both locally
    # and in required CI.
    name: openapi-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: lint
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - name: Spectral lint openapi.json
        uses: stoplightio/spectral-action@6416fd018ae38e60136775066eb3e98172143141  # v0.8.13
        with:
          file_glob: openapi.json
          spectral_ruleset: .spectral.yaml

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-hermes-${{ runner.os }}-${{ hashFiles('pixi.toml', 'pixi.lock') }}
          restore-keys: |
            podman-hermes-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build --ignorefile ci/.dockerignore -f ci/Containerfile -t hermes-ci:local .
      # All checks run inside the CI container — the same image developers
      # use via `just ci-deps-version-sync`.
      - name: deps-version-sync (in container)
        run: bash scripts/run_ci_local.sh deps-version-sync

  openapi-drift:
    name: openapi-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347  # v0.10.1
        with:
          pixi-version: v0.68.0
          cache: true

      - name: Re-export OpenAPI spec
        run: pixi run python scripts/export-openapi.py --output /tmp/openapi-ci.json

      - name: Confirm export is deterministic (two runs match)
        # Guards against any future regression that would reintroduce non-deterministic
        # key ordering and false-positive the diff step below.
        run: |
          set -euo pipefail
          pixi run python scripts/export-openapi.py --output /tmp/openapi-ci-2.json
          diff -u /tmp/openapi-ci.json /tmp/openapi-ci-2.json

      - name: Diff committed openapi.json against fresh export
        run: |
          set -euo pipefail
          if ! diff -u openapi.json /tmp/openapi-ci.json; then
            echo ""
            echo '::error::openapi.json is out of date. Run `just export-openapi` and commit the result.'
            exit 1
          fi
          echo "OK: openapi.json matches the live FastAPI schema"
