name: docker-build

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - src/hermes/**
      - .github/workflows/docker-build.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  docker-build-smoke:
    # Build the production image whenever a PR touches the Dockerfile or its
    # build inputs, so a broken layer (e.g. a bad apt package name in the
    # tini/curl install) fails fast in CI instead of at deploy time.
    # See issue #562 (follow-up from #355).
    name: docker-build-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build image (smoke)
        # Blocking: a non-zero exit from `docker buildx build` fails the PR.
        # --load makes the image available to the local daemon; no --push.
        run: docker buildx build --load -t hermes:ci .
